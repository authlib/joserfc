name: Test

on:
  push:
    branches-ignore:
      - 'wip-*'
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - '*.md'
      - '*.rst'
  pull_request:
    branches-ignore:
      - 'wip-*'
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - '*.md'
      - '*.rst'


permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --python python

      - name: ruff lint
        run: uv run --locked --no-sync ruff check

      - name: mypy lint
        run: uv run --locked --no-sync mypy

  test:
    needs: lint
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
          - "pypy-3.11"

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --python python

      - name: Report coverage
        run: uv run --locked --no-sync pytest --cov=joserfc --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: GitHub

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
